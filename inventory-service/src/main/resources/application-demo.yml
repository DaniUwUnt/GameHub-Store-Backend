# Perfil local para la defensa sin Docker. Los datos persisten en archivos separados.
spring:
  datasource:
    url: jdbc:h2:file:./datos/gh_inventory;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_CLAVE}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
app:
  catalogo-equipo: true
