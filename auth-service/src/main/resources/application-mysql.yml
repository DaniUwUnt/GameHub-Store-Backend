# Base persistente propia de auth-service.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/gh_auth?connectionTimeZone=UTC&sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&allowPublicKeyRetrieval=${DB_PUBLIC_KEY:false}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
app:
  catalogo-equipo: true
